upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    server_name aingan.click www.aingan.click;
    return 301 https://$server_name$request_uri;
}

# --- HTTPS server ---
server {
    listen 443 ssl http2;
    server_name aingan.click www.aingan.click;

    # --- SSL certificates (Let's Encrypt via Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/aingan.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aingan.click/privkey.pem;

    # --- SSL configuration ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # --- Backend: API ---
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Backend: Health ---
    location /health {
        proxy_pass http://backend;
    }

    # --- Backend: Swagger ---
    location /docs {
        proxy_pass http://backend;
    }

    location /openapi.json {
        proxy_pass http://backend;
    }

    # --- Backend: AI discovery ---
    location /llms.txt {
        proxy_pass http://backend;
    }

    location /.well-known/ {
        proxy_pass http://backend;
    }

    # --- Backend: MCP SSE ---
    location /mcp/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # --- Backend: SEO HTML pages ---
    location /posts/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Backend: SEO files ---
    location /sitemap.xml {
        proxy_pass http://backend;
    }

    location /robots.txt {
        proxy_pass http://backend;
    }

    # --- Frontend: Next.js (catch-all, must be last) ---
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
